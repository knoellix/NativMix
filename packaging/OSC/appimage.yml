# OBS AppImage recipe for NativMix.
# Maintainer steps: packaging/OSC/APPIMAGE.md
# Upstream: https://docs.appimage.org/packaging-guide/hosted-services/opensuse-build-service.html
#
# Project needs an "AppImage" repository that paths to:
#   - this project's RPM repo (provides package "nativmix")
#   - OBS:AppImage / AppImage
#
# Add to _service when enabling AppImage builds:
#   <service name="appimage"/>

app: nativmix
binpatch: true

ingredients:
  packages:
    - nativmix

script:
  - cd $BUILD_APPDIR/
  - cp $BUILD_APPDIR/usr/share/applications/nativmix.desktop $BUILD_APPDIR/
  - cp $BUILD_APPDIR/usr/share/icons/hicolor/256x256/apps/nativmix.png $BUILD_APPDIR/
