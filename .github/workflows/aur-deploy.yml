name: AUR Deploy

# Manual only while Arch has AUR pushes disabled for community accounts.
# Re-enable tag/schedule triggers after Arch reopens writes:
# https://lists.archlinux.org/archives/list/aur-general@lists.archlinux.org/message/YPJ3FQYJTJXXY3RUXCYLMHUKHLIUNVFF/
# Tracking: https://github.com/knoellix/NativMix/issues/24

on:
  workflow_dispatch:

jobs:
  aur-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Deploy to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.NATIVMIX_AUR_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "ERROR: secret NATIVMIX_AUR_KEY is empty or missing"
            exit 1
          fi

          PKGVER="$(sed -n 's/^pkgver=//p' packaging/aur/PKGBUILD | head -1)"
          PKGREL="$(sed -n 's/^pkgrel=//p' packaging/aur/PKGBUILD | head -1)"
          WANT_VER="${PKGVER}-${PKGREL}"
          echo "Wanted AUR version: ${WANT_VER}"

          AUR_VER="$(curl -fsSL -A 'nativmix-aur-deploy' "https://aur.archlinux.org/rpc/v5/info?arg[]=nativmix" \
            | python3 -c 'import sys,json; r=json.load(sys.stdin)["results"]; print(r[0]["Version"] if r else "")' || true)"
          echo "Current AUR version: ${AUR_VER:-<unknown>}"
          if [ -n "${AUR_VER}" ] && [ "${AUR_VER}" = "${WANT_VER}" ]; then
            echo "AUR already at ${WANT_VER}; nothing to do."
            exit 0
          fi

          # 1. Setup SSH — accept PEM private key OR base64(PEM) (paste-safe)
          mkdir -p ~/.ssh
          KEY_FILE=~/.ssh/id_ed25519
          RAW="$(printf '%s' "$AUR_SSH_PRIVATE_KEY" | tr -d '\r')"

          write_key() {
            printf '%s\n' "$1" > "$KEY_FILE"
            if [ -n "$(tail -c1 "$KEY_FILE" 2>/dev/null || true)" ]; then
              printf '\n' >> "$KEY_FILE"
            fi
            chmod 600 "$KEY_FILE"
          }

          if printf '%s' "$RAW" | grep -q 'BEGIN .*PRIVATE KEY'; then
            if printf '%s' "$RAW" | grep -q $'\n'; then
              write_key "$RAW"
            else
              write_key "$(printf '%s' "$RAW" | sed 's/\\n/\n/g')"
            fi
          else
            if DECODED="$(printf '%s' "$RAW" | tr -d '[:space:]' | base64 -d 2>/dev/null)" \
              && printf '%s' "$DECODED" | grep -q 'BEGIN .*PRIVATE KEY'; then
              write_key "$DECODED"
              echo "Decoded NATIVMIX_AUR_KEY from base64"
            else
              echo "ERROR: NATIVMIX_AUR_KEY is neither a PEM private key nor base64(PEM)."
              exit 1
            fi
          fi

          echo "Key file lines: $(wc -l < "$KEY_FILE")  bytes: $(wc -c < "$KEY_FILE")"
          echo "Key header: $(head -1 "$KEY_FILE")"
          if ! grep -q 'BEGIN .*PRIVATE KEY' "$KEY_FILE"; then
            echo "ERROR: NATIVMIX_AUR_KEY does not look like a PEM private key (missing BEGIN line)."
            exit 1
          fi

          if ! ssh-keygen -y -f "$KEY_FILE" >/tmp/aur_pubkey 2>/tmp/aur_keyerr; then
            echo "ERROR: OpenSSH cannot load NATIVMIX_AUR_KEY (libcrypto)."
            cat /tmp/aur_keyerr || true
            exit 1
          fi
          echo "AUR deploy key fingerprint:"
          ssh-keygen -lf /tmp/aur_pubkey

          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null || true
          {
            echo 'Host aur.archlinux.org'
            echo '  User aur'
            echo '  IdentityFile ~/.ssh/id_ed25519'
            echo '  IdentitiesOnly yes'
            echo '  StrictHostKeyChecking accept-new'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

          echo "Testing SSH auth to AUR..."
          ssh -T aur@aur.archlinux.org 2>&1 | tee /tmp/aur_ssh_hello || true
          if ! grep -Eiq 'welcome to aur|hi[[:space:]]' /tmp/aur_ssh_hello; then
            echo "ERROR: AUR SSH auth failed (no welcome/Hi greeting)."
            exit 1
          fi

          # Fail fast if Arch still has writes disabled (no multi-hour polling)
          help_out="$(ssh -o BatchMode=yes -o ConnectTimeout=20 aur@aur.archlinux.org help 2>&1 || true)"
          if printf '%s' "$help_out" | grep -qi 'maintenance'; then
            echo "ERROR: AUR SSH write still disabled (maintenance banner)."
            echo "Official: https://lists.archlinux.org/archives/list/aur-general@lists.archlinux.org/message/YPJ3FQYJTJXXY3RUXCYLMHUKHLIUNVFF/"
            echo "Tracking: https://github.com/knoellix/NativMix/issues/24"
            exit 1
          fi

          # 2. Clone AUR repo
          rm -rf /tmp/aur-repo
          git clone ssh://aur@aur.archlinux.org/nativmix.git /tmp/aur-repo

          # 3. Copy files
          cp packaging/aur/PKGBUILD packaging/aur/nativmix.install /tmp/aur-repo/
          cd /tmp/aur-repo

          # 4. Generate Checksums and .SRCINFO
          chmod 777 .
          docker run --rm -v "$(pwd):/pkg" -w /pkg archlinux:latest bash -c "
            pacman -Sy --noconfirm pacman-contrib binutils sudo &&
            useradd -m builder &&
            chown -R builder /pkg &&
            su builder -c 'updpkgsums && makepkg --printsrcinfo' > .SRCINFO"

          sudo chown -R "$USER:$USER" .

          # 5. Config Git and Push
          git config --global --add safe.directory /tmp/aur-repo
          git config user.name "knoelliX"
          git config user.email "moellix@knoellix.net"
          git add PKGBUILD nativmix.install .SRCINFO
          git commit -m "Update to ${GITHUB_REF_NAME:-v${WANT_VER}} (automatic checksums)" || echo "No changes to commit"
          git push origin master
          echo "AUR push succeeded."
