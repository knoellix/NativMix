[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nativmix"
version = "1.0.19"
description = "A hardware-assisted volume mixer for PipeWire/PulseAudio (Linux) and WASAPI (Winndoof)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Christian Möllmann (knoelliX)", email = "moellix@knoellix.net" }]
requires-python = ">=3.10"
keywords = ["audio", "mixer", "pipewire", "pulseaudio", "arduino", "pyqt6", "wayland"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt", # Note: Qt handles Wayland natively
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Mixers",
]

dependencies = [
    "PyQt6>=6.6",
    "pulsectl>=23.5.2",
    "pyserial>=3.5",
    "setproctitle>=1.3",
    "mido>=1.3",
    "python-rtmidi>=1.5",
]

[project.optional-dependencies]
# Windows-only backend (Winndoof support)
windows = [
    "pycaw>=20230407",
    "comtypes>=1.2",
    "psutil>=5.9",
]
dev = [
    "pytest>=7.4",
    "pytest-qt>=4.2",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
nativmix = "nativmix.main:main"

[project.urls]
Homepage = "https://github.com/knoelliX/NativMix"
Repository = "https://github.com/knoelliX/NativMix"
Issues = "https://github.com/knoelliX/NativMix/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
# IMPORTANT: Ensure your folder is named 'lib' or 'src' consistently
where = ["lib"]
include = ["nativmix*"]

[tool.setuptools.package-data]
# Ensure type hints and assets are included
nativmix = ["py.typed", "assets/*.svg", "assets/*.png"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["lib"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PT"]
ignore = ["B008"]

[tool.pytest.ini_options]
qt_api = "pyqt6"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
